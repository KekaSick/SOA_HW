name: soa-homework-3
services:
  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U booking -d booking]
      interval: 2s
      timeout: 3s
      retries: 30
  flight-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    volumes:
      - flight-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U flight -d flight]
      interval: 2s
      timeout: 3s
      retries: 30
  booking-migrate:
    image: flyway/flyway:10.20.1
    command: [-url=jdbc:postgresql://booking-db:5432/booking, -user=booking, -password=booking, migrate]
    volumes:
      - ./migrations/booking:/flyway/sql:ro
    depends_on:
      booking-db:
        condition: service_healthy
  flight-migrate:
    image: flyway/flyway:10.20.1
    command: [-url=jdbc:postgresql://flight-db:5432/flight, -user=flight, -password=flight, migrate]
    volumes:
      - ./migrations/flight:/flyway/sql:ro
    depends_on:
      flight-db:
        condition: service_healthy
  redis-master:
    image: redis:7.4-alpine
  redis-replica:
    image: redis:7.4-alpine
    command: [redis-server, --replicaof, redis-master, '6379']
    depends_on:
      - redis-master
  redis-sentinel:
    image: redis:7.4-alpine
    command:
      - sh
      - -ec
      - |
        if [ ! -f /data/sentinel.conf ]; then
          cp /etc/redis/sentinel.conf /data/sentinel.conf
        fi
        exec redis-sentinel /data/sentinel.conf
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
      - redis-replica
    healthcheck:
      test: [CMD-SHELL, redis-cli -p 26379 ping | grep -q PONG]
      interval: 2s
      timeout: 3s
      retries: 30
  flight:
    build: .
    command: [python, -m, app.flight]
    environment:
      DATABASE_URL: postgresql://flight:flight@flight-db:5432/flight
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:-homework-local-key}
      REDIS_SENTINEL_HOST: redis-sentinel
    depends_on:
      flight-migrate:
        condition: service_completed_successfully
      redis-sentinel:
        condition: service_healthy
  booking:
    build: .
    command: [uvicorn, app.booking:app, --host, 0.0.0.0, --port, '8080']
    ports:
      - '8083:8080'
    environment:
      DATABASE_URL: postgresql://booking:booking@booking-db:5432/booking
      FLIGHT_ADDRESS: flight:50051
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:-homework-local-key}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
      CIRCUIT_OPEN_SECONDS: ${CIRCUIT_OPEN_SECONDS:-10}
      CIRCUIT_WINDOW_SECONDS: ${CIRCUIT_WINDOW_SECONDS:-30}
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight:
        condition: service_started
volumes:
  booking-data:
  flight-data:
