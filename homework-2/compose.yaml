name: soa-homework-2
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U marketplace -d marketplace]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: flyway/flyway:10.20.1
    command: [-url=jdbc:postgresql://db:5432/marketplace, -user=marketplace, -password=marketplace, migrate]
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - '8082:8080'
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace
      ORDER_INTERVAL_MINUTES: ${ORDER_INTERVAL_MINUTES:-1}
      JWT_SECRET: ${JWT_SECRET:-homework-local-secret-at-least-32-characters}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
