openapi: 3.0.3
info:
  title: 'Marketplace: OpenAPI + CRUD'
  version: 1.0.0
  description: Контракт ДЗ №2. REST, PostgreSQL, локальные ACID-транзакции. Обязательные
    ограничения и каталог ошибок описаны в схемах и responses.
servers:
- url: http://localhost:8082
security:
- bearerAuth: []
paths:
  /products:
    get:
      tags:
      - Products
      operationId: listProducts
      summary: Список товаров
      description: 'USER, SELLER, ADMIN: чтение любых товаров.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: category
        in: query
        description: Точное совпадение
        schema:
          type: string
    post:
      tags:
      - Products
      operationId: createProduct
      summary: Создать товар
      description: 'SELLER: только свои товары; ADMIN: любые; USER: ACCESS_DENIED.
        seller_id при создании берётся из JWT.'
      responses:
        '201':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
  /products/{id}:
    get:
      tags:
      - Products
      operationId: getProduct
      summary: Получить товар
      description: 'USER, SELLER, ADMIN: чтение любых товаров.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters: &id001
      - name: id
        in: path
        required: true
        schema: &id004
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
      - Products
      operationId: updateProduct
      summary: Обновить товар
      description: 'SELLER: только свои товары; ADMIN: любые; USER: ACCESS_DENIED.
        seller_id при создании берётся из JWT.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      parameters: *id001
    delete:
      tags:
      - Products
      operationId: deleteProduct
      summary: Архивировать товар
      description: 'SELLER: только свои товары; ADMIN: любые; USER: ACCESS_DENIED.
        seller_id при создании берётся из JWT.'
      responses:
        '204':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters: *id001
  /orders:
    post:
      tags:
      - Orders
      operationId: createOrder
      summary: Создать заказ
      description: 'USER, ADMIN: создание своего заказа; SELLER: ACCESS_DENIED. Проверки:
        частота → активный заказ → каталог → остатки → резерв → цены → промокод →
        запись операции. Процент свыше 70% означает полную стоимость без скидки.'
      responses:
        '201':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
  /orders/{id}:
    get:
      tags:
      - Orders
      operationId: getOrder
      summary: Получить заказ
      description: 'USER: только свои заказы; ADMIN: любые; SELLER: ACCESS_DENIED.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters: *id001
    put:
      tags:
      - Orders
      operationId: updateOrder
      summary: Обновить позиции заказа
      description: 'USER: только свои заказы; ADMIN: любые; SELLER: ACCESS_DENIED.
        Только CREATED. Все изменения в одной транзакции. Промокод проверяется заново;
        при сумме ниже min_order_amount скидка снимается.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      parameters: *id001
  /orders/{id}/cancel:
    post:
      tags:
      - Orders
      operationId: cancelOrder
      summary: Отменить заказ
      description: 'USER: только свои заказы; ADMIN: любые; SELLER: ACCESS_DENIED.
        Только CREATED/PAYMENT_PENDING → CANCELED. Возврат остатков и использования
        промокода в одной транзакции. Других переходов API не выполняет.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters: *id001
  /promo-codes:
    post:
      tags:
      - PromoCodes
      operationId: createPromoCode
      summary: Создать промокод
      description: 'SELLER, ADMIN: разрешено; USER: ACCESS_DENIED. valid_until не
        раньше valid_from.'
      responses:
        '201':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Зарегистрироваться
      description: 'Публичный метод. Регистрирует USER. SELLER и ADMIN заведены миграцией
        для демонстрации. Повтор username: VALIDATION_ERROR.'
      responses:
        '201':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Войти
      description: 'Публичный метод. Access: 15 минут; refresh: 7 дней. В JWT находятся
        sub, role и тип токена.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refresh
      summary: Обновить токены
      description: 'Публичный метод. Принимает только refresh token. Невалидный/истёкший:
        REFRESH_TOKEN_INVALID.'
      responses:
        '200':
          description: Успешное выполнение
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    DiscountType:
      type: string
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
    UserRole:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    ProductCreate:
      type: object
      required: &id002
      - name
      - price
      - stock
      - category
      - status
      properties: &id003
        name: &id005
          type: string
          minLength: 1
          maxLength: 255
        description: &id006
          type: string
          maxLength: 4000
          nullable: true
        price: &id007
          type: number
          format: decimal
          minimum: 0.01
        stock: &id008
          type: integer
          minimum: 0
        category: &id009
          type: string
          minLength: 1
          maxLength: 100
        status: &id010
          $ref: '#/components/schemas/ProductStatus'
      additionalProperties: false
    ProductUpdate:
      type: object
      required: *id002
      properties: *id003
      additionalProperties: false
    ProductResponse:
      type: object
      required:
      - id
      - name
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id: *id004
        name: *id005
        description: *id006
        price: *id007
        stock: *id008
        category: *id009
        status: *id010
        seller_id: *id004
        created_at: &id011
          type: string
          format: date-time
        updated_at: *id011
      additionalProperties: false
    ProductPage:
      type: object
      required:
      - items
      - totalElements
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
      additionalProperties: false
    ApiError:
      type: object
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
          description: Машиночитаемый код ошибки из каталога responses.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
      additionalProperties: false
    OrderItemInput:
      type: object
      required:
      - product_id
      - quantity
      properties:
        product_id: *id004
        quantity:
          type: integer
          minimum: 1
          maximum: 999
      additionalProperties: false
    OrderCreate:
      type: object
      required:
      - items
      properties:
        items: &id012
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemInput'
        promo_code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
          nullable: true
      additionalProperties: false
    OrderUpdate:
      type: object
      required:
      - items
      properties:
        items: *id012
      additionalProperties: false
    OrderItemResponse:
      type: object
      required:
      - id
      - product_id
      - quantity
      - price_at_order
      properties:
        id: *id004
        product_id: *id004
        quantity:
          type: integer
        price_at_order:
          type: number
          format: decimal
          minimum: 0
      additionalProperties: false
    OrderResponse:
      type: object
      required:
      - id
      - user_id
      - status
      - total_amount
      - discount_amount
      - created_at
      - updated_at
      - items
      properties:
        id: *id004
        user_id: *id004
        status:
          $ref: '#/components/schemas/OrderStatus'
        promo_code_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        total_amount:
          type: number
          format: decimal
          minimum: 0
        discount_amount:
          type: number
          format: decimal
          minimum: 0
        created_at: *id011
        updated_at: *id011
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
      additionalProperties: false
    PromoCodeCreate:
      type: object
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      - active
      properties:
        code: &id013
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
        discount_type: &id014
          $ref: '#/components/schemas/DiscountType'
        discount_value: &id015
          type: number
          format: decimal
          minimum: 0
        min_order_amount: &id016
          type: number
          format: decimal
          minimum: 0
        max_uses: &id017
          type: integer
          minimum: 0
        valid_from: *id011
        valid_until: *id011
        active: &id018
          type: boolean
          default: true
      additionalProperties: false
    PromoCodeResponse:
      type: object
      required:
      - id
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      - active
      - current_uses
      properties:
        id: *id004
        code: *id013
        discount_type: *id014
        discount_value: *id015
        min_order_amount: *id016
        max_uses: *id017
        valid_from: *id011
        valid_until: *id011
        active: *id018
        current_uses:
          type: integer
      additionalProperties: false
    RegisterRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
      additionalProperties: false
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
      additionalProperties: false
    UserResponse:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id: *id004
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
      additionalProperties: false
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
      additionalProperties: false
    TokenResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          example: 900
      additionalProperties: false
  responses:
    BadRequest:
      description: 'VALIDATION_ERROR: невалидные поля и нарушения перечисляются в
        details.'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 'TOKEN_EXPIRED: истёк access token; TOKEN_INVALID: невалидный access
        token или неверные учётные данные; REFRESH_TOKEN_INVALID: невалидный или просроченный
        refresh token.'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 'ACCESS_DENIED: недостаточно прав роли или товар другого продавца;
        ORDER_OWNERSHIP_VIOLATION: заказ другого пользователя (ADMIN имеет доступ
        к любым).'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 'PRODUCT_NOT_FOUND: товар не найден; ORDER_NOT_FOUND: заказ не
        найден.'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 'PRODUCT_INACTIVE: товар неактивен; ORDER_HAS_ACTIVE: есть CREATED/PAYMENT_PENDING;
        INVALID_STATE_TRANSITION: недопустимое состояние; INSUFFICIENT_STOCK: в details.items
        перечислены product_id, requested, available.'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 'PROMO_CODE_INVALID: промокод не найден/неактивен/истёк/исчерпан;
        PROMO_CODE_MIN_AMOUNT: сумма ниже минимальной.'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: 'ORDER_LIMIT_EXCEEDED: с последней CREATE_ORDER или UPDATE_ORDER
        прошло менее N минут.'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: 'INTERNAL_ERROR: внутренняя ошибка сервера.'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
